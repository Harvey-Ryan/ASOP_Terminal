# Railway config for the sc-data worker service.
# In the service's Settings, set "Config-as-code" / Railway Config File to:
#   apps/sc-data/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/sc-data/Dockerfile"
# Only rebuild this service when its own code changes.
watchPatterns = ["apps/sc-data/**", "package-lock.json"]

[deploy]
# Every 5 minutes (Railway's minimum). Upstream is a repo we don't own, so we
# can't receive a webhook from it; instead each run asks GitHub for the head
# commit (one small request) and exits in about a second if nothing changed.
# This also picks up "Sync now" requests from the web app.
cronSchedule = "*/5 * * * *"
# Cron jobs exit when done; don't treat that as a crash.
restartPolicyType = "NEVER"
