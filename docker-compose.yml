services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dem
      POSTGRES_PASSWORD: dem_dev_password
      POSTGRES_DB: dem
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dem -d dem"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dem
      POSTGRES_PASSWORD: dem_test_password
      POSTGRES_DB: dem_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dem -d dem_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
