# TEMPORARY: exercises the guardrail scripts against real past merges before
# the pull_request_target workflow exists on master. Removed before merge.
name: Guardrails self-test
on:
  push:
    branches: [chore/contribution-guardrails]
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scope on PR #109 (expect fail on version bump only)
        run: node scripts/sections.mjs check $(git log --format=%H -1 --grep='#109')^1 $(git log --format=%H -1 --grep='#109') || echo "exit=$?"
      - name: Schema on PR #76 (dropped old fleet tables; expect fail)
        run: |
          M=$(git log --format=%H -1 --grep='#76 from')
          node scripts/schemaSafety.mjs check $M^1 $M^2 && echo "UNEXPECTED PASS" || echo "exit=$? (expected 1)"
      - name: Schema on PR #76 with the label (expect pass)
        env:
          PR_LABELS: '["schema-reviewed"]'
        run: |
          M=$(git log --format=%H -1 --grep='#76 from')
          node scripts/schemaSafety.mjs check $M^1 $M^2
      - name: Schema on PR #107 (additive; expect pass)
        run: |
          M=$(git log --format=%H -1 --grep='#106 from')
          node scripts/schemaSafety.mjs check $M^1 $M^2
      - name: Schema unchanged (PR #109; expect skip)
        run: |
          M=$(git log --format=%H -1 --grep='#109 from')
          node scripts/schemaSafety.mjs check $M^1 $M^2
